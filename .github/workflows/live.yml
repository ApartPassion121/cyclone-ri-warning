name: live-storms
on:
  schedule: [{cron: "20 */6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas
      - run: python tools/update_live.py
      - run: |
          git config user.name "live-bot"; git config user.email "actions@github.com"
          git add live_storms.json wind_frames.json
          git commit -m "live storms update" || echo "no change"
          git push
